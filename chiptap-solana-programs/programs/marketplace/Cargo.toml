[package]
name    = "marketplace"
version = "0.1.0"
edition = "2021"
description = "ChipTap PvP — P2P chip marketplace (escrowed listings, direct wallet-to-wallet SOL)"

[lib]
crate-type = ["cdylib", "lib"]
name = "marketplace"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1" }
mpl-core    = { version = "0.7.2", features = ["anchor"] }

[build-dependencies]
proc-macro2 = "=1.0.86"
